<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Crazy8 Monday San Ramon</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
}

.banner{
    background:#0b3d91;
    color:white;
    text-align:center;
    padding:25px;
}

.container{
    max-width:1100px;
    margin:20px auto;
    padding:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#0b3d91;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

td.player{
    text-align:left;
    font-weight:bold;
}

.inactive{
    background:#fafafa;
    color:#777;
}

.positive{
    color:green;
    font-weight:bold;
}

.negative{
    color:red;
    font-weight:bold;
}

.footer{
    text-align:center;
    color:#777;
    font-size:0.9rem;
    margin:25px 0;
}

.footer2{
    text-align:center;
    color:orange;
    font-size:0.9rem;
    margin:25px 0; 
}



</style>
</head>

<body>

<div class="banner">
<h1>Carmelo's 12 minute lunch patrol</h1>
<p>Player Ratings & Match Results</p>
</div>

<div class="container">

<table>

<thead>
<tr>
<th>Player</th>
<th>Rating</th>
<th>Played</th>
<th>Won</th>
<th>Lost</th>
<th>Win %</th>
<th>Original</th>
<th>Change</th>
</tr>
</thead>

<tbody>
</tbody>
</table>

</div>
